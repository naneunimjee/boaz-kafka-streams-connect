# BOAZ Kafka Streams & Connect 실습
# 구성: Kafka(KRaft) + Kafka UI + MySQL + Kafka Connect(Debezium)
#
# 데이터 흐름:
#   MySQL(orders) ─Debezium Source─▶ orders.raw ─파이썬 Streams─▶ 결과 토픽 ─JDBC Sink─▶ MySQL(sales_summary)

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "127.0.0.1:9092:9092"          # 내 PC(파이썬 스크립트)에서 접속할 때: localhost:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 컨테이너끼리는 kafka:29092, 내 PC에서는 localhost:9092 로 접속
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # 브로커 1대짜리 실습 환경이라 복제 계수는 전부 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 토픽 자동 생성 시 기본 파티션 3개 (Task/Partition 실습용)
      KAFKA_NUM_PARTITIONS: 3
      # 노트북 메모리 절약 (기본 1GB → 512MB)
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: kafbat/kafka-ui:v1.1.0
    container_name: kafka-ui
    ports:
      - "127.0.0.1:8080:8080"          # 브라우저에서 http://localhost:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: boaz-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      # Kafka UI에서 Connector 상태도 같이 보이게
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
    depends_on:
      kafka:
        condition: service_healthy

  mysql:
    image: mysql:8.0.46
    container_name: mysql
    ports:
      - "127.0.0.1:3307:3306"          # 내 PC에 MySQL이 이미 깔려 있어도 안 겹치게 3307
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shop
      MYSQL_USER: boaz
      MYSQL_PASSWORD: boaz
    # CDC용 binlog 설정 + 메모리 절약(performance_schema 끄기)
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --performance-schema=OFF
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  connect:
    image: quay.io/debezium/connect:2.7.3.Final
    container_name: connect
    ports:
      - "127.0.0.1:8083:8083"          # Connector 등록용 REST API
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: connect-cluster        # Distributed 모드: 같은 GROUP_ID의 Worker끼리 일을 나눔
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets   # Source offset(어디까지 읽었나)이 여기 저장됨
      STATUS_STORAGE_TOPIC: connect_statuses
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      # 노트북 메모리 절약 (기본 최대 2GB → 768MB)
      HEAP_OPTS: "-Xms256m -Xmx768m"
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
